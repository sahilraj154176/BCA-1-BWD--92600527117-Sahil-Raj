<!-- 3.  Create a any simple table using bootstrap grid system. -->

<!DOCTYPE html>
<html>
<head>
    <title>Bootstrap Grid Table</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container mt-5">

        <h2 class="text-center mb-4">Student Details</h2>

        <!-- Table Heading -->
        <div class="row bg-dark text-white text-center p-3">
            <div class="col">Roll No</div>
            <div class="col">Name</div>
            <div class="col">Course</div>
            <div class="col">Marks</div>
        </div>

        <!-- Row 1 -->
        <div class="row text-center border p-3">
            <div class="col">1</div>
            <div class="col">Rahul</div>
            <div class="col">BCA</div>
            <div class="col">85</div>
        </div>

        <!-- Row 2 -->
        <div class="row text-center border p-3">
            <div class="col">2</div>
            <div class="col">Priya</div>
            <div class="col">BBA</div>
            <div class="col">90</div>
        </div>

        <!-- Row 3 -->
        <div class="row text-center border p-3">
            <div class="col">3</div>
            <div class="col">Amit</div>
            <div class="col">BCA</div>
            <div class="col">78</div>
        </div>

    </div>

</body>
</html>
