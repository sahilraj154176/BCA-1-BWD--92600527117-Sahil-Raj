
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nature Explore - Contact</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f2f2f2;
        }

        header {
            background-color: darkgreen;
            color: white;
            text-align: center;
            padding: 20px;
        }

        nav {
            background-color: #333;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 15px;
            font-size: 17px;
        }

        nav a:hover {
            background-color: darkgreen;
        }

        .container {
            background-color: white;
            margin: 30px;
            padding: 25px;
        }

        h2 {
            color: darkgreen;
        }

        p {
            font-size: 16px;
            line-height: 1.6;
        }

        label {
            font-weight: bold;
        }

        input, textarea {
            padding: 10px;
            width: 95%;
            margin-top: 8px;
            margin-bottom: 15px;
        }

        input[type="submit"], input[type="reset"] {
            width: auto;
            padding: 10px 20px;
            background-color: darkgreen;
            color: white;
            border: none;
            cursor: pointer;
        }

        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 15px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Nature Explore</h1>
        <p>Contact Us</p>
    </header>

    <nav>
        <a href="L8.html">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </nav>

    <div class="container">

        <h2>Contact Us</h2>

        <p>
            Have questions? Feel free to contact us.
        </p>

        <p><b>Email:</b> natureexplore@example.com</p>
        <p><b>Phone:</b> +91 99999 99999</p>
        <p><b>Location:</b> Rajkot, Gujarat, India</p>

        <hr>

        <h2>Send Us a Message</h2>

        <form action="#" method="post">

            <label for="name">Full Name:</label><br>
            <input type="text" id="name" name="name"
                   placeholder="Enter your name" required><br>

            <label for="email">Email Address:</label><br>
            <input type="email" id="email" name="email"
                   placeholder="Enter your email" required><br>

            <label for="message">Message:</label><br>
            <textarea id="message" name="message"
                      rows="5" placeholder="Write your message"
                      required></textarea><br>

            <input type="submit" value="Submit">
            <input type="reset" value="Reset">

        </form>

    </div>

    <footer>
        <p>Nature Explore</p>
    </footer>

</body>
</html>
